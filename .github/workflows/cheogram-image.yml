# Builds the Jingle-patched image and publishes it to GHCR. Every check runs on every push,
# so a rebase onto a new upstream tag is verified by pushing it.
name: Cheogram image

on:
  push:
    branches:
      - '*-cheogram-dtls'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/asterisk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read the base version
        id: v
        run: |
          echo "version=$(cat cheogram/VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Loaded, not pushed: the image the tests run against has to be the image that ships.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cheogram/Dockerfile
          load: true
          tags: cheogram-asterisk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Startup test
        run: cheogram/tests/run-startup-test.sh cheogram-asterisk:ci

      - name: Jingle stanza test
        run: cheogram/tests/run-jingle-test.sh cheogram-asterisk:ci

      - name: Jingle stanza test (dtlsenable=no)
        run: cheogram/tests/run-jingle-test.sh cheogram-asterisk:ci nodtls

      # Test-only, never pushed: uninitialized stack variables become a deterministic crash
      # instead of depending on what the stack held, which is how chan_motif's did.
      - name: Build (pattern-initialized stack)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cheogram/Dockerfile
          load: true
          tags: cheogram-asterisk:ci-pattern
          build-args: ASTCFLAGS=-ftrivial-auto-var-init=pattern
          cache-from: type=gha,scope=pattern
          cache-to: type=gha,mode=max,scope=pattern

      - name: Jingle stanza test (pattern-initialized stack)
        run: cheogram/tests/run-jingle-test.sh cheogram-asterisk:ci-pattern

      - name: Jingle stanza test (pattern-initialized stack, dtlsenable=no)
        run: cheogram/tests/run-jingle-test.sh cheogram-asterisk:ci-pattern nodtls

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          v=${{ steps.v.outputs.version }}-cheogram-dtls
          docker tag cheogram-asterisk:ci "$IMAGE:$v"
          docker tag cheogram-asterisk:ci "$IMAGE:$v-${{ steps.v.outputs.sha }}"
          docker push "$IMAGE:$v"
          docker push "$IMAGE:$v-${{ steps.v.outputs.sha }}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published \`$IMAGE:$v\` \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      # Proves the registry copy, not just the local one, carries the patches.
      - name: Verify the published image
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          ref="$IMAGE@${{ steps.push.outputs.digest }}"
          docker pull -q "$ref"
          docker run --rm --entrypoint assert-modules "$ref" chan_motif.so res_xmpp.so res_srtp.so res_rtp_asterisk.so pbx_lua.so res_pjsip.so
          docker run --rm --entrypoint /usr/sbin/asterisk "$ref" -V
          for i in cheogram-asterisk:ci "$ref"; do
            docker run --rm --entrypoint sh "$i" -c 'cd /usr/lib/asterisk/modules && sha256sum chan_motif.so res_xmpp.so res_rtp_asterisk.so res_srtp.so pbx_lua.so res_pjsip.so'
          done > /tmp/sums
          diff <(head -6 /tmp/sums) <(tail -6 /tmp/sums) && echo "ok    published modules match the tested build"
