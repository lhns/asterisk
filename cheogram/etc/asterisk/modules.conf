; Asterisk refuses to start without this file ("Module initialization failed").
;
; autoload plus a noload list: which modules exist is decided by the image's menuselect.
[modules]
autoload=yes

; Unused, and each logs an ERROR at boot for a config file we do not ship. ARI is also an
; HTTP API: one less listener.
noload => res_ari.so
noload => res_aeap.so
noload => res_speech_aeap.so
noload => chan_websocket.so
noload => res_websocket_client.so
; Deployments write their pjsip objects out in full, so no wizard.
noload => res_pjsip_config_wizard.so

; Everything below had already declined to load: noise reduction only. Re-derive it from the
; boot log (`module show` for the Running set) after a menuselect change.
noload => app_agent_pool.so
noload => app_alarmreceiver.so
noload => app_amd.so
noload => app_festival.so
noload => app_followme.so
noload => app_queue.so
noload => app_stasis_broadcast.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
noload => chan_iax2.so
noload => chan_unistim.so
noload => pbx_ael.so
noload => pbx_config.so
noload => pbx_dundi.so
noload => res_calendar.so
noload => res_hep.so
noload => res_parking.so
noload => res_phoneprov.so
noload => res_pjsip_notify.so
noload => res_pjsip_publish_asterisk.so
noload => res_prometheus.so
noload => res_stasis_broadcast.so
noload => res_stun_monitor.so
